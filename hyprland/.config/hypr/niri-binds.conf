# =============================================================================
# Niri -> Hyprland keybind translation
# =============================================================================
# Omarchy ships Hyprland, not Niri. This file ports the keybinds from
# niri/.config/niri/config.kdl to Hyprland so the muscle memory carries over.
#
# Install:
#   ./install.sh --hyprland
#   # then add this line to ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/niri-binds.conf
#
# Notes:
#   * Hyprland is a dwindle/tiling WM, not a scrolling column WM. Niri's
#     "column" concepts (consume/expel, preset widths, center-column) have no
#     exact 1:1 equivalent and are marked below.
#   * Omarchy already defines many SUPER binds. Source this file *after* its
#     defaults; later binds win. Remove/comment any you want to keep from Omarchy.
# =============================================================================

$nmod = SUPER

# --- Apps --------------------------------------------------------------------
# Niri: Mod+Shift+Slash -> show-hotkey-overlay
bind = $nmod SHIFT, Slash, exec, omarchy-menu-keybindings
bind = $nmod, Return, exec, ghostty
bind = $nmod, Space, exec, ignis toggle-window Launcher
bind = $nmod, B, exec, brave
bind = $nmod, E, exec, nautilus
bind = $nmod, W, exec, ignis run-command open-settings-network
bind = $nmod, P, exec, ignis toggle-window PowerMenu
bind = $nmod ALT, L, exec, ~/.local/bin/niri-locker
bind = $nmod, X, killactive
bind = $nmod SHIFT, X, killactive

# Niri: Mod+O -> toggle-overview. Hyprland needs the hyprexpo plugin:
bind = $nmod, O, exec, hyprctl dispatch hyprexpo:expo toggle

# --- Vim motions: focus ------------------------------------------------------
bind = CTRL, H, movefocus, l
bind = CTRL, J, movefocus, d
bind = CTRL, K, movefocus, u
bind = CTRL, L, movefocus, r

# --- Vim motions: move window / column --------------------------------------
bind = $nmod CTRL, H, movewindow, l
bind = $nmod CTRL, L, movewindow, r
# Niri: move-window-to-workspace-down/up
bind = $nmod CTRL, J, movetoworkspace, e+1
bind = $nmod CTRL, K, movetoworkspace, e-1

# --- Workspace focus ---------------------------------------------------------
# Niri: Mod+Left = workspace up, Mod+Right = workspace down
bind = $nmod, Left, workspace, e-1
bind = $nmod, Right, workspace, e+1

# --- Monitors ----------------------------------------------------------------
bind = $nmod SHIFT, Left, focusmonitor, l
bind = $nmod SHIFT, Down, focusmonitor, d
bind = $nmod SHIFT, Up, focusmonitor, u
bind = $nmod SHIFT, Right, focusmonitor, r
bind = $nmod SHIFT, H, focusmonitor, l
bind = $nmod SHIFT, J, focusmonitor, d
bind = $nmod SHIFT, K, focusmonitor, u
bind = $nmod SHIFT, L, focusmonitor, r

bind = $nmod SHIFT CTRL, Left, movewindow, mon:l
bind = $nmod SHIFT CTRL, Down, movewindow, mon:d
bind = $nmod SHIFT CTRL, Up, movewindow, mon:u
bind = $nmod SHIFT CTRL, Right, movewindow, mon:r
bind = $nmod SHIFT CTRL, H, movewindow, mon:l
bind = $nmod SHIFT CTRL, J, movewindow, mon:d
bind = $nmod SHIFT CTRL, K, movewindow, mon:u
bind = $nmod SHIFT CTRL, L, movewindow, mon:r

# --- Workspace navigation ----------------------------------------------------
bind = $nmod, Page_Down, workspace, e+1
bind = $nmod, Page_Up, workspace, e-1
bind = $nmod, U, workspace, e+1
bind = $nmod, I, workspace, e-1

bind = $nmod CTRL, Page_Down, movetoworkspace, e+1
bind = $nmod CTRL, Page_Up, movetoworkspace, e-1
bind = $nmod CTRL, U, movetoworkspace, e+1
bind = $nmod CTRL, I, movetoworkspace, e-1

# Niri: Mod+Shift+Page_Down/Up -> move-workspace-down/up.
# Hyprland has no "move a workspace" action; omitted.

# --- Mouse wheel -------------------------------------------------------------
bind = $nmod, mouse_down, workspace, e+1
bind = $nmod, mouse_up, workspace, e-1
bind = $nmod CTRL, mouse_down, movetoworkspace, e+1
bind = $nmod CTRL, mouse_up, movetoworkspace, e-1
bind = $nmod, mouse_right, movefocus, r
bind = $nmod, mouse_left, movefocus, l

# --- Workspaces 1-9 ---------------------------------------------------------
bind = $nmod, 1, workspace, 1
bind = $nmod, 2, workspace, 2
bind = $nmod, 3, workspace, 3
bind = $nmod, 4, workspace, 4
bind = $nmod, 5, workspace, 5
bind = $nmod, 6, workspace, 6
bind = $nmod, 7, workspace, 7
bind = $nmod, 8, workspace, 8
bind = $nmod, 9, workspace, 9

bind = $nmod CTRL, 1, movetoworkspace, 1
bind = $nmod CTRL, 2, movetoworkspace, 2
bind = $nmod CTRL, 3, movetoworkspace, 3
bind = $nmod CTRL, 4, movetoworkspace, 4
bind = $nmod CTRL, 5, movetoworkspace, 5
bind = $nmod CTRL, 6, movetoworkspace, 6
bind = $nmod CTRL, 7, movetoworkspace, 7
bind = $nmod CTRL, 8, movetoworkspace, 8
bind = $nmod CTRL, 9, movetoworkspace, 9

# --- Window sizing / layout --------------------------------------------------
# Niri: Mod+F maximize-column, Mod+Shift+F fullscreen-window
bind = $nmod, F, fullscreen, 1
bind = $nmod SHIFT, F, fullscreen, 0
bind = $nmod, M, fullscreen, 1
bind = $nmod, C, centerwindow
bind = $nmod, V, togglefloating
bind = $nmod SHIFT, V, togglesplit

bind = $nmod, Minus, resizeactive, -10% 0
bind = $nmod, Equal, resizeactive, 10% 0
bind = $nmod SHIFT, Minus, resizeactive, 0 -10%
bind = $nmod SHIFT, Equal, resizeactive, 0 10%

# Niri-only, no Hyprland equivalent (left as comments for reference):
#   Mod+BracketLeft/Right  consume-or-expel-window-left/right
#   Mod+Comma/Period       consume-window-into-column / expel-window-from-column
#   Mod+R / Mod+Shift+R    switch-preset-column-width(-back)
#   Mod+Ctrl+R             reset-window-height
#   Mod+Ctrl+F             expand-column-to-available-width
#   Mod+Ctrl+C             center-visible-columns
#   Mod+Home / Mod+End     focus-column-first / last
#   Mod+Ctrl+Home/End      move-column-to-first / last

# --- Media / brightness ------------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl  = , XF86AudioMute,        exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioStop,  exec, playerctl stop
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioNext,  exec, playerctl next

bindel = , XF86MonBrightnessUp,   exec, brightnessctl --class=backlight set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight set 10%-

# --- Screenshots -------------------------------------------------------------
# Omarchy ships hyprshot. If you prefer grim/slurp, swap these out.
bind = , Print, exec, hyprshot -m region
bind = CTRL, Print, exec, hyprshot -m output
bind = ALT, Print, exec, hyprshot -m window
bind = CTRL SHIFT, S, exec, hyprshot -m region

# --- Session / power ---------------------------------------------------------
# Niri: Mod+Escape toggles keyboard-shortcuts inhibit. Hyprland has no direct
# equivalent, so it is omitted.
bind = $nmod SHIFT, E, exit
bind = CTRL ALT, Delete, exit
bind = $nmod SHIFT, P, exec, hyprctl dispatch dpms off
