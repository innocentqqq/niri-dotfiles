background_opacity 0.8
dynamic_background_opacity yes

cursor_shape beam
cursor_beam_thickness 9.0

include colors.conf

# Start zsh even if the wallpaper or fastfetch is missing on a fresh machine.
shell zsh -c "kitten icat --transfer-mode file ~/Pictures/Wallpapers/Purple_Skull_small.jpg 2>/dev/null; command -v fastfetch >/dev/null && fastfetch; exec zsh"
